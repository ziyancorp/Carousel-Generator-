<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziyan Carousel Generator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .slide-card {
      aspect-ratio: 4 / 5;
      width: 360px;
      min-width: 360px;
      height: 450px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-black font-black text-xl">
          Z
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Ziyan Carousel Studio</h1>
          <p class="text-xs text-slate-400">Viral Multi-Slide Generator for Instagram, Threads & LinkedIn</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="exportAllBtn" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-sm transition flex items-center gap-2">
          <span>📥</span> Unduh Semua Slide (PNG)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left: Controls & Editor -->
    <div class="lg:col-span-4 space-y-6">
      
      <!-- Preset Generator -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
          <span>⚡</span> Quick Generator
        </h2>
        
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">Topik / Ide Carousel:</label>
          <input type="text" id="topicInput" placeholder="Contoh: 5 Model AI Gratis Pengganti ChatGPT..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="loadTemplate('ai_free')" class="p-2.5 text-left bg-slate-950 hover:bg-slate-800/60 border border-slate-800 rounded-xl transition">
            <p class="text-xs font-bold text-slate-200">🤖 AI Tools & xKiro</p>
            <p class="text-[10px] text-slate-400">Promo 25 Model Gratis</p>
          </button>
          <button onclick="loadTemplate('affiliate')" class="p-2.5 text-left bg-slate-950 hover:bg-slate-800/60 border border-slate-800 rounded-xl transition">
            <p class="text-xs font-bold text-slate-200">🛍️ Jualan Produk</p>
            <p class="text-[10px] text-slate-400">Formula 10s Matrix</p>
          </button>
        </div>

        <button id="generateBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold rounded-xl text-xs transition border border-emerald-500/20">
          ✨ Format Slide Otomatis
        </button>
      </div>

      <!-- Slide Customizer -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">⚙️ Desain & Branding</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Branding / Handle:</label>
            <input type="text" id="handleInput" value="@ziyancorp" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Tema Warna:</label>
            <select id="themeSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
              <option value="emerald">Emerald Dark (Modern)</option>
              <option value="cyberpunk">Cyberpunk Neon (Viral)</option>
              <option value="minimal">Clean Minimalist</option>
              <option value="gradient">Deep Purple Gradient</option>
            </select>
          </div>
        </div>

        <hr class="border-slate-800">

        <!-- Slide List Editor -->
        <div class="space-y-3" id="slidesEditorContainer">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">Daftar Slide (<span id="slideCountText">5</span>)</span>
            <button onclick="addNewSlide()" class="text-[11px] text-emerald-400 hover:underline font-bold">+ Tambah Slide</button>
          </div>
          <div id="slideFormList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
            <!-- Dynamic Slide Inputs -->
          </div>
        </div>

      </div>

    </div>

    <!-- Right: Live Horizontal Preview -->
    <div class="lg:col-span-8 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <span>📱</span> Live Carousel Preview (Swipe Horizontal)
        </h2>
        <span class="text-xs text-slate-500">Format Rasio 4:5 (Optimal IG / LinkedIn / Threads)</span>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 overflow-x-auto">
        <div id="carouselTrack" class="flex gap-6 pb-4">
          <!-- Slide Cards rendered here -->
        </div>
      </div>
    </div>

  </main>

  <script>
    let slides = [
      {
        tag: "RAHASIA DEVELOPER",
        title: "Stop Bayar Langganan AI Mahal!",
        content: "Ada platform yang kasih kamu akses 25 Model AI Flagship secara 100% GRATIS tanpa kartu kredit.",
        badge: "Slide 1 / 5",
        cta: "Swipe ke kiri 👈"
      },
      {
        tag: "MODEL UNGGULAN #1",
        title: "Qwen 3.8 Max (1M Context)",
        content: "Flagship terbaru dari Alibaba dengan memori 1 JUTA token. Super pintar buat naskah video jualan, riset, dan analisis data.",
        badge: "Slide 2 / 5",
        cta: "Next 👈"
      },
      {
        tag: "MODEL UNGGULAN #2",
        title: "MiniMax M3 & Qwen Coder",
        content: "Spesialis coding dan tugas agen otonom. Bikin script bot dan otomasi tanpa takut kehabisan kuota harian.",
        badge: "Slide 3 / 5",
        cta: "Next 👈"
      },
      {
        tag: "BONUS LANGSUNG",
        title: "Dapat Saldo Gift $5 Saat Daftar",
        content: "Langsung dapat kredit $5 untuk coba model premium seperti DeepSeek V4 Pro dan Grok 4.6 secara gratis.",
        badge: "Slide 4 / 5",
        cta: "Next 👈"
      },
      {
        tag: "CARA KLAIM SEKARANG",
        title: "Klaim Akses Gratisnya Sekarang!",
        content: "Akses link resmi di bawah ini atau klik link di bio:\n\n👉 https://xkiro.com/ref/99KNZTR\n\nSimpan postingan ini sebelum dihapus!",
        badge: "Slide 5 / 5",
        cta: "Save & Share 🚀"
      }
    ];

    function renderEditor() {
      const container = document.getElementById('slideFormList');
      container.innerHTML = '';
      slides.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-xs';
        div.innerHTML = `
          <div class="flex items-center justify-between font-bold text-slate-300">
            <span>Slide ${idx + 1}</span>
            ${slides.length > 2 ? `<button onclick="removeSlide(${idx})" class="text-rose-400 hover:text-rose-300 text-[10px]">Hapus</button>` : ''}
          </div>
          <input type="text" value="${s.tag}" oninput="updateSlide(${idx}, 'tag', this.value)" placeholder="Tag Kategori" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-slate-200">
          <input type="text" value="${s.title}" oninput="updateSlide(${idx}, 'title', this.value)" placeholder="Judul Slide" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-slate-200 font-bold">
          <textarea oninput="updateSlide(${idx}, 'content', this.value)" placeholder="Isi Slide..." rows="3" class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-slate-200">${s.content}</textarea>
        `;
        container.appendChild(div);
      });
      document.getElementById('slideCountText').innerText = slides.length;
    }

    function renderCarousel() {
      const track = document.getElementById('carouselTrack');
      const handle = document.getElementById('handleInput').value || '@ziyancorp';
      const theme = document.getElementById('themeSelect').value;
      track.innerHTML = '';

      let bgClass = "bg-slate-900 border-slate-800 text-slate-100";
      let tagClass = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
      let accentTitle = "text-white";
      
      if (theme === 'cyberpunk') {
        bgClass = "bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 border-fuchsia-500/30 text-slate-100";
        tagClass = "bg-fuchsia-500/20 text-fuchsia-300 border-fuchsia-500/40";
        accentTitle = "text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-cyan-400";
      } else if (theme === 'minimal') {
        bgClass = "bg-white border-slate-200 text-slate-900";
        tagClass = "bg-slate-100 text-slate-700 border-slate-300";
        accentTitle = "text-slate-900";
      } else if (theme === 'gradient') {
        bgClass = "bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 border-indigo-500/30 text-slate-100";
        tagClass = "bg-indigo-500/20 text-indigo-300 border-indigo-500/40";
        accentTitle = "text-indigo-200";
      }

      slides.forEach((s, idx) => {
        const card = document.createElement('div');
        card.id = `slide-node-${idx}`;
        card.className = `slide-card ${bgClass} border rounded-2xl p-7 flex flex-col justify-between shadow-2xl relative select-none`;
        
        card.innerHTML = `
          <!-- Top Header -->
          <div class="flex items-center justify-between">
            <span class="px-2.5 py-1 rounded-full border text-[10px] font-bold tracking-wider uppercase ${tagClass}">
              ${s.tag}
            </span>
            <span class="text-[11px] font-semibold opacity-60">
              ${idx + 1} / ${slides.length}
            </span>
          </div>

          <!-- Center Content -->
          <div class="space-y-4 my-auto">
            <h3 class="text-xl font-extrabold font-display leading-tight tracking-tight ${accentTitle}">
              ${s.title}
            </h3>
            <p class="text-xs leading-relaxed opacity-80 whitespace-pre-line font-normal">
              ${s.content}
            </p>
          </div>

          <!-- Bottom Footer -->
          <div class="pt-4 border-t border-slate-700/40 flex items-center justify-between text-[11px] opacity-75 font-semibold">
            <div class="flex items-center gap-2">
              <div class="w-4 h-4 rounded-full bg-emerald-500 flex items-center justify-center text-[9px] text-black font-black">Z</div>
              <span>${handle}</span>
            </div>
            <span class="text-emerald-400 font-bold">${s.cta || 'Swipe 👈'}</span>
          </div>
        `;
        track.appendChild(card);
      });
    }

    function updateSlide(idx, field, val) {
      slides[idx][field] = val;
      renderCarousel();
    }

    function addNewSlide() {
      slides.push({
        tag: "POIN PENTING",
        title: "Judul Slide Baru",
        content: "Tuliskan penjelasan singkat, padat, dan bernilai tinggi di sini.",
        badge: `Slide ${slides.length + 1}`,
        cta: "Next 👈"
      });
      renderEditor();
      renderCarousel();
    }

    function removeSlide(idx) {
      if (slides.length > 2) {
        slides.splice(idx, 1);
        renderEditor();
        renderCarousel();
      }
    }

    function loadTemplate(type) {
      if (type === 'ai_free') {
        slides = [
          { tag: "RAHASIA AI 2026", title: "Stop Bayar Langganan AI Mahal!", content: "Gunakan 25 Model AI Flagship gratis tanpa langganan bulanan di xKiro.", cta: "Swipe 👈" },
          { tag: "FLAGSHIP ALIBABA", title: "Qwen 3.8 Max (1M Context)", content: "Otak paling pintar untuk naskah video jualan, koding bot, dan analisis riset data.", cta: "Next 👈" },
          { tag: "SPESIALIS KODING", title: "MiniMax M3 & Coder Plus", content: "Kapasitas 1 Juta token tanpa takut throttling untuk developer dan kreator.", cta: "Next 👈" },
          { tag: "BONUS REGISTER", title: "Bonus Saldo $5 Instan", content: "Daftar sekarang dan langsung dapat $5 saldo gift untuk coba model DeepSeek & Grok.", cta: "Next 👈" },
          { tag: "LINK AKSES", title: "Klaim di Link Bio Sekarang!", content: "👉 https://xkiro.com/ref/99KNZTR\n\nSimpan postingan ini agar tidak lupa!", cta: "Klaim Sekarang 🚀" }
        ];
      } else if (type === 'affiliate') {
        slides = [
          { tag: "OUTFIT REKOMENDASI", title: "Elegan Tanpa Ribet!", content: "Review jujur produk fashion simpel yang bikin look kamu lebih chic dan rapi.", cta: "Swipe 👈" },
          { tag: "DETAIL SILUET", title: "Desain Simpel & Nyaman", content: "Bahan jatuh, tidak mudah kusut, dan pas untuk acara casual maupun formal.", cta: "Next 👈" },
          { tag: "PILIHAN WARNA", title: "Kombinasi Warna Netral", content: "Gampang dipadukan dengan berbagai atasan dan sepatu favorit kamu.", cta: "Next 👈" },
          { tag: "LINK CHECKOUT", title: "Cek Link di Bio Sekarang", content: "Tersedia di etalase Shopee/TikTok kami. Klik link di bio untuk order!", cta: "Checkout 🛍️" }
        ];
      }
      renderEditor();
      renderCarousel();
    }

    // Event Listeners
    document.getElementById('handleInput').addEventListener('input', renderCarousel);
    document.getElementById('themeSelect').addEventListener('change', renderCarousel);

    // Export All Slides
    document.getElementById('exportAllBtn').addEventListener('click', async () => {
      const btn = document.getElementById('exportAllBtn');
      btn.innerText = "⏳ Sedang Merender...";
      btn.disabled = true;

      for (let i = 0; i < slides.length; i++) {
        const el = document.getElementById(`slide-node-${i}`);
        if (el) {
          const canvas = await html2canvas(el, { scale: 3, useCORS: true });
          const a = document.createElement('a');
          a.download = `Ziyan_Carousel_Slide_${i + 1}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        }
      }

      btn.innerHTML = "<span>📥</span> Unduh Semua Slide (PNG)";
      btn.disabled = false;
    });

    // Init
    renderEditor();
    renderCarousel();
  </script>
</body>
</html>
